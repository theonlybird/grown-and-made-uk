<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Review queue — Grown and Made UK</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="assets/theme.css" />
<style>
  /* A tool, not a page: denser than the public site, but the same palette and
     type so it doesn't feel like a different product. */
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
  header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
  .bar{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .bar.tabs{padding-bottom:0;gap:0;border-bottom:1px solid var(--line)}
  h1{font-family:var(--font-heading);font-size:21px;margin:0 14px 0 0;color:var(--racing-green)}
  .counts{font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums}
  button{font:600 13px var(--font-body);padding:7px 13px;border:1px solid var(--line-strong);
    background:#fff;color:var(--ink);border-radius:8px;cursor:pointer}
  button:hover{border-color:var(--racing-green)}
  button.on{background:var(--racing-green);color:#fff;border-color:var(--racing-green)}
  button.go{background:var(--racing-green);color:#fff;border-color:var(--racing-green)}
  button.no{background:#fff;color:#8C1D2C;border-color:#E3B9C0}
  button:focus-visible{outline:2px solid var(--racing-green);outline-offset:2px}
  /* Tabs are the top-level switch: which queue you are working. The filter
     row below them belongs to whichever tab is open. */
  .tab{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;
    padding:11px 15px;font-size:14px;font-weight:600;color:var(--muted)}
  .tab:hover{border-color:transparent;color:var(--ink)}
  .tab.on{background:none;color:var(--racing-green);border-bottom-color:var(--racing-green)}
  .tab .n{font-variant-numeric:tabular-nums;font-weight:700}
  main{max-width:860px;margin:0 auto;padding:20px}
  .gate{max-width:380px;margin:80px auto;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:26px}
  .gate h2{font-family:var(--font-heading);margin:0 0 6px;color:var(--racing-green)}
  .gate p{font-size:14px;color:var(--muted);margin:0 0 16px}
  input[type=password],input[type=text]{width:100%;font:15px var(--font-body);padding:10px 12px;
    border:1px solid var(--line-strong);border-radius:9px;background:var(--bg);color:var(--ink)}
  select{font:600 13px var(--font-body);padding:7px 10px;border:1px solid var(--line-strong);
    border-radius:8px;background:#fff;color:var(--ink)}
  .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
  .card.done{opacity:.55}
  .top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .nm{font-weight:700;font-size:15.5px}
  .badge{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    padding:2px 8px;border-radius:4px}
  .k-correction{background:#E4EDE7;color:#004225}
  .k-tier-appeal{background:#F4EBD4;color:#7D5F22}
  .k-removal{background:#F7E7E9;color:#8C1D2C}
  .k-confirmation{background:#E7EDF3;color:#2F4A63}
  .s-new{background:#eef1f4;color:#39434e}
  .s-approved{background:#E4EDE7;color:#004225}
  .s-rejected{background:#F7E7E9;color:#8C1D2C}
  .s-applied{background:#dfe8e2;color:#00301B}
  .g-pending{background:#F4EBD4;color:#7D5F22}
  .g-dismissed{background:#eef1f4;color:#39434e}
  .g-approved{background:#E4EDE7;color:#004225}
  .g-added{background:#004225;color:#fff}
  .cat{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
  .when{font-size:12.5px;color:var(--muted-2)}
  .diff{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0}
  .diff div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:9px 12px;
    border-bottom:1px solid var(--line);font-size:14px}
  .diff div:last-child{border-bottom:0}
  .fname{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);
    font-weight:700;padding-top:2px}
  .was{color:var(--muted-2);text-decoration:line-through;display:block;font-size:13px}
  .now{color:var(--ink);font-weight:600;display:block}
  .block{margin:10px 0;padding:11px 13px;border-radius:9px;background:var(--bg);
    border-left:3px solid var(--line-strong);font-size:14px}
  .block.appeal{background:#FCF7EC;border-left-color:#C79A3E}
  .block.removal{background:#F7E7E9;border-left-color:#8C1D2C}
  .block.dupe{background:#F7E7E9;border-left-color:#8C1D2C}
  .block .bl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    color:var(--muted-2);margin-bottom:5px}
  .block a{color:var(--racing-green);word-break:break-all}
  .block p.pre{white-space:pre-wrap;margin:0}
  .who{font-size:13px;color:var(--muted);margin:10px 0 0}
  .who .rel{font-weight:700;color:var(--ink)}
  .acts{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
  .acts input{flex:1;min-width:170px}
  .err{background:#F7E7E9;border:1px solid #E3B9C0;color:#8C1D2C;padding:10px 13px;
    border-radius:9px;font-size:14px;margin-bottom:12px}
  .empty{text-align:center;color:var(--muted-2);padding:50px 20px;font-size:15px}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h2>Review queue</h2>
  <p>Enter the review password.</p>
  <p class="err" id="gate-err" hidden></p>
  <form id="gate-form">
    <input type="password" id="pw" autocomplete="current-password" autofocus />
    <div style="margin-top:12px"><button class="go" type="submit">Open</button></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="bar tabs">
      <button class="tab on" id="tab-updates" data-tab="updates">Listing updates <span class="n" id="n-updates"></span></button>
      <button class="tab" id="tab-suggestions" data-tab="suggestions">New businesses <span class="n" id="n-suggestions"></span></button>
    </div>

    <div class="bar" id="bar-updates">
      <h1>Listing updates</h1>
      <span class="counts" id="counts"></span>
      <button data-f="new" class="on">New</button>
      <button data-f="confirmation">Confirmations</button>
      <button data-f="tier-appeal">Tier appeals</button>
      <button data-f="removal">Removals</button>
      <button data-f="all">All</button>
      <span style="flex:1"></span>
      <button id="export">Export approved</button>
      <button id="refresh">Refresh</button>
    </div>

    <div class="bar" id="bar-suggestions" hidden>
      <h1>New businesses</h1>
      <span class="counts" id="scounts"></span>
      <button data-sf="pending" class="on">Pending</button>
      <button data-sf="approved">Approved</button>
      <button data-sf="dismissed">Dismissed</button>
      <button data-sf="added">Added</button>
      <button data-sf="all">All</button>
      <span style="flex:1"></span>
      <button id="sexport">Export approved</button>
      <button id="srefresh">Refresh</button>
    </div>
  </header>
  <main>
    <p class="err" id="err" hidden></p>
    <div id="list"></div>
    <div id="slist" hidden></div>
  </main>
</div>

<script>
(function () {
  var PW = '';                       // kept in memory + sessionStorage, never in the URL
  var ROWS = [];                     // listing updates
  var SUGS = [];                     // new-business suggestions
  var filter = 'new';
  var sfilter = 'pending';
  var tab = 'updates';
  var $ = function (id) { return document.getElementById(id); };

  function api(payload) {
    return fetch('/api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ password: PW }, payload))
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (d) {
        if (!res.ok) throw new Error(d.error || ('Request failed (' + res.status + ')'));
        return d;
      });
    });
  }

  /* Escapes for text AND attribute values. The old version round-tripped
     through textContent/innerHTML, which leaves quotes alone -- so a value
     like  x" onmouseover="...  broke out of an href. Anything shown here
     can come from the public suggestion form, so treat all of it as hostile. */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* A link only if it is plainly http(s). Anything else -- javascript:, data:,
     a bare word -- is shown as text you can read but not click. */
  function link(url) {
    var u = String(url == null ? '' : url).trim();
    if (!/^https?:\/\//i.test(u)) return esc(u);
    return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(u) + '</a>';
  }

  function visible() {
    return ROWS.filter(function (r) {
      if (filter === 'all') return true;
      if (filter === 'new') return r.status === 'new';
      return r.kind === filter;
    });
  }

  function render() {
    var list = $('list');
    var rows = visible();
    list.innerHTML = '';
    if (!rows.length) {
      list.innerHTML = '<p class="empty">Nothing here.</p>';
    }
    rows.forEach(function (r) {
      var card = document.createElement('div');
      card.className = 'card' + (r.status === 'new' ? '' : ' done');
      var html =
        '<div class="top"><span class="nm">' + esc(r.business_name) + '</span>'
        + '<span class="badge k-' + esc(r.kind) + '">' + esc(r.kind.replace('-', ' ')) + '</span>'
        + '<span class="badge s-' + esc(r.status) + '">' + esc(r.status) + '</span>'
        + '<span class="when">' + new Date(r.submitted_at).toLocaleString('en-GB') + '</span></div>';

      var fields = Object.keys(r.changes || {});
      if (fields.length) {
        html += '<div class="diff">' + fields.map(function (f) {
          return '<div><span class="fname">' + esc(f) + '</span><span>'
            + (r.changes[f].from ? '<span class="was">' + esc(r.changes[f].from) + '</span>' : '')
            + '<span class="now">' + esc(r.changes[f].to) + '</span></span></div>';
        }).join('') + '</div>';
      }
      if (r.kind === 'confirmation') {
        html += '<div class="block"><div class="bl">Confirmed as correct</div>'
          + '<p style="margin:0">They reviewed their listing and told us nothing needs changing.</p></div>';
      }
      if (r.pin) {
        var d = r.pin.metres;
        html += '<div class="block"><div class="bl">Pin moved '
          + (d < 1000 ? d + 'm' : (d / 1000).toFixed(1) + 'km') + '</div>'
          + '<p style="margin:0 0 6px">' + r.pin.from.lat + ', ' + r.pin.from.lng
          + ' &rarr; <strong>' + r.pin.to.lat + ', ' + r.pin.to.lng + '</strong></p>'
          + '<p style="margin:0"><a href="https://www.openstreetmap.org/?mlat=' + r.pin.to.lat
          + '&mlon=' + r.pin.to.lng + '#map=17/' + r.pin.to.lat + '/' + r.pin.to.lng
          + '" target="_blank" rel="noopener">See where they put it</a> — check it is not their front door before approving.</p></div>';
      }
      if (r.location) {
        var g = r.location, agree = g.agrees === true;
        html += '<div class="block' + (agree ? '' : ' appeal') + '">'
          + '<div class="bl">County &amp; country &mdash; ' + (agree ? 'agreed' : 'CHECK THIS') + '</div>';
        if (g.pin)  html += '<p style="margin:0 0 4px">pin says: <strong>' + esc(g.pin.county || '?')
          + '</strong>, ' + esc(g.pin.country || '?') + (g.pin.parish ? ' (' + esc(g.pin.parish) + ')' : '') + '</p>';
        if (g.text) html += '<p style="margin:0 0 4px">their text says: <strong>' + esc(g.text.county || 'no county named')
          + '</strong>, ' + esc(g.text.nation || '?') + '</p>';
        html += '<p style="margin:0">' + (agree
          ? 'Applying <strong>' + esc(g.county) + ', ' + esc(g.nation) + '</strong>' + (g.why ? ' &mdash; ' + esc(g.why) : '')
          : 'Not applied &mdash; ' + esc(g.why || g.error || 'the two readings disagree') + '. Set it by hand.')
          + '</p></div>';
      }
      if (r.appeal) {
        html += '<div class="block appeal"><div class="bl">Tier appeal — currently ' + esc(r.tier) + '</div>'
          + '<p style="margin:0 0 6px"><em>' + esc(r.appeal.question) + '</em></p>'
          + '<p style="margin:0">' + esc(r.appeal.answer || '(no answer given)') + '</p>'
          + (r.appeal.link ? '<p style="margin:6px 0 0">' + link(r.appeal.link) + '</p>' : '')
          + '</div>';
      }
      if (r.removal) {
        html += '<div class="block removal"><div class="bl">Removal requested</div>'
          + '<p style="margin:0">They have asked to be taken off the map.</p></div>';
      }
      if (r.notes) {
        html += '<div class="block"><div class="bl">Their note</div><p style="margin:0">' + esc(r.notes) + '</p></div>';
      }
      html += '<p class="who">' + esc(r.from.name || 'no name') + ' &middot; '
        + (r.from.email ? '<a href="mailto:' + esc(r.from.email) + '">' + esc(r.from.email) + '</a>' : 'no email')
        + '</p>'
        + '<div class="acts"><button class="go" data-a="approved">Approve</button>'
        + '<button class="no" data-a="rejected">Reject</button>'
        + '<input type="text" placeholder="Note to yourself (optional)" value="' + esc(r.review_note || '') + '" /></div>';
      card.innerHTML = html;

      card.querySelectorAll('[data-a]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var note = card.querySelector('.acts input').value;
          btn.disabled = true;
          api({ action: 'set-status', submission_id: r.submission_id, status: btn.dataset.a, review_note: note })
            .then(function (d) {
              var i = ROWS.findIndex(function (x) { return x.submission_id === r.submission_id; });
              if (i > -1) ROWS[i] = d.submission;
              render();
            })
            .catch(function (e) { btn.disabled = false; showErr(e.message); });
        });
      });
      list.appendChild(card);
    });

    var by = { neu: 0, appeal: 0, removal: 0, confirmed: 0 };
    ROWS.forEach(function (r) {
      if (r.status === 'new') by.neu++;
      if (r.kind === 'tier-appeal' && r.status === 'new') by.appeal++;
      if (r.kind === 'removal' && r.status === 'new') by.removal++;
      if (r.kind === 'confirmation' && r.status === 'new') by.confirmed++;
    });
    $('counts').textContent = by.neu + ' new of ' + ROWS.length + ' · '
      + by.confirmed + ' confirmations · ' + by.appeal + ' tier appeals · ' + by.removal + ' removals';
    $('n-updates').textContent = by.neu ? '(' + by.neu + ')' : '';
  }

  /* ---------- new-business suggestions ---------- */

  var REASONS = [
    ['', 'Reason…'],
    ['not-uk-made', 'Not UK-made'],
    ['already-listed', 'Already listed'],
    ['retailer-not-maker', 'Retailer, not maker'],
    ['cannot-verify', 'Cannot verify'],
    ['out-of-scope', 'Out of scope'],
    ['other', 'Other']
  ];
  var REASON_LABEL = REASONS.reduce(function (m, r) { m[r[0]] = r[1]; return m; }, {});

  function svisible() {
    return SUGS.filter(function (s) { return sfilter === 'all' ? true : s.status === sfilter; });
  }

  function renderSug() {
    var list = $('slist');
    var rows = svisible();
    list.innerHTML = '';
    if (!rows.length) {
      list.innerHTML = '<p class="empty">Nothing here.</p>';
    }
    rows.forEach(function (s) {
      var b = s.business || {}, ev = s.evidence || {}, from = s.from || {};
      var card = document.createElement('div');
      card.className = 'card' + (s.status === 'pending' ? '' : ' done');
      var html =
        '<div class="top"><span class="nm">' + esc(b.name) + '</span>'
        + '<span class="badge cat">' + esc(b.category || '?') + '</span>'
        + '<span class="badge cat">' + esc(b.listing_type || '?') + '</span>'
        + '<span class="badge g-' + esc(s.status) + '">' + esc(s.status) + '</span>'
        + '<span class="when">' + new Date(s.submitted_at).toLocaleString('en-GB') + '</span></div>';

      /* The most valuable line on the card: is this already on the map? */
      if (s.duplicate_of) {
        html += '<div class="block dupe"><div class="bl">Already listed</div>'
          + '<p style="margin:0">Same website as <strong>' + esc(s.duplicate_of.name) + '</strong> ('
          + esc(s.duplicate_of.tier) + ', <code>' + esc(s.duplicate_of.id) + '</code>). '
          + 'Check before adding — it may still be a correction worth making.</p></div>';
      }

      html += '<div class="diff">'
        + '<div><span class="fname">Website</span><span class="now">' + link(b.website) + '</span></div>'
        + (b.instagram ? '<div><span class="fname">Instagram</span><span class="now">' + link(b.instagram) + '</span></div>' : '')
        + '<div><span class="fname">Address</span><span class="now">' + esc(b.address) + '</span></div>'
        + '</div>';

      html += '<div class="block"><div class="bl">Where it is made or grown</div>'
        + '<p class="pre">' + esc(ev.made_in_uk) + '</p></div>';
      if (ev.materials) {
        html += '<div class="block appeal"><div class="bl">Materials — decides Gold vs Silver</div>'
          + '<p class="pre">' + esc(ev.materials) + '</p></div>';
      }
      if (ev.links) {
        html += '<div class="block"><div class="bl">Evidence links</div>'
          + '<p class="pre">' + esc(ev.links) + '</p></div>';
      }
      if (s.status === 'dismissed' && s.dismiss_reason) {
        html += '<div class="block removal"><div class="bl">Dismissed</div>'
          + '<p style="margin:0">' + esc(REASON_LABEL[s.dismiss_reason] || s.dismiss_reason) + '</p></div>';
      }

      /* Relationship sits with the name, not buried: "I own or run it" is a
         different quality of lead from "I'm a customer". */
      html += '<p class="who"><span class="rel">' + esc(from.relationship || 'connection not given') + '</span> &middot; '
        + esc(from.name || 'no name') + ' &middot; '
        + (from.email ? '<a href="mailto:' + esc(from.email) + '">' + esc(from.email) + '</a>' : 'no email')
        + '</p>';

      html += '<div class="acts">'
        + '<button class="go" data-s="approved">Approve</button>'
        + '<button class="no" data-s="dismissed">Dismiss</button>'
        + '<select data-reason>' + REASONS.map(function (r) {
            return '<option value="' + r[0] + '"' + (s.dismiss_reason === r[0] ? ' selected' : '') + '>' + r[1] + '</option>';
          }).join('') + '</select>'
        + (s.status === 'pending' ? '' : '<button data-s="pending">Back to pending</button>')
        + '<input type="text" placeholder="Note to yourself (optional)" value="' + esc(s.review_note || '') + '" /></div>';
      card.innerHTML = html;

      card.querySelectorAll('[data-s]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var note = card.querySelector('.acts input').value;
          var reason = card.querySelector('[data-reason]').value;
          if (btn.dataset.s === 'dismissed' && !reason) {
            showErr('Pick a reason before dismissing — it is what makes the same business arriving twice quick to deal with.');
            return;
          }
          btn.disabled = true;
          api({ action: 'set-suggestion-status', suggestion_id: s.suggestion_id,
                status: btn.dataset.s, dismiss_reason: reason, review_note: note })
            .then(function (d) {
              var i = SUGS.findIndex(function (x) { return x.suggestion_id === s.suggestion_id; });
              if (i > -1) SUGS[i] = d.suggestion;
              $('err').hidden = true;
              renderSug();
            })
            .catch(function (e) { btn.disabled = false; showErr(e.message); });
        });
      });
      list.appendChild(card);
    });

    var n = { pending: 0, approved: 0, dismissed: 0, added: 0 };
    SUGS.forEach(function (s) { if (n[s.status] != null) n[s.status]++; });
    $('scounts').textContent = n.pending + ' pending of ' + SUGS.length + ' · '
      + n.approved + ' approved · ' + n.dismissed + ' dismissed · ' + n.added + ' added';
    $('n-suggestions').textContent = n.pending ? '(' + n.pending + ')' : '';
  }

  function showErr(m) { $('err').textContent = m; $('err').hidden = false; }

  function load() {
    $('err').hidden = true;
    return api({ action: 'list' }).then(function (d) { ROWS = d.submissions || []; render(); });
  }

  function loadSug() {
    $('err').hidden = true;
    return api({ action: 'list-suggestions' }).then(function (d) { SUGS = d.suggestions || []; renderSug(); });
  }

  /* Both queues are fetched on unlock so each tab shows a count without
     having to be opened first. A failure on either surfaces at the gate. */
  function loadAll() {
    return Promise.all([load(), loadSug()]);
  }

  $('gate-form').addEventListener('submit', function (e) {
    e.preventDefault();
    PW = $('pw').value;
    $('gate-err').hidden = true;
    loadAll().then(function () {
      sessionStorage.setItem('gm-admin-pw', PW);
      $('gate').hidden = true; $('app').hidden = false;
    }).catch(function (err) {
      $('gate-err').textContent = err.message; $('gate-err').hidden = false;
    });
  });

  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      tab = b.dataset.tab;
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === b); });
      var updates = tab === 'updates';
      $('bar-updates').hidden = !updates;
      $('bar-suggestions').hidden = updates;
      $('list').hidden = !updates;
      $('slist').hidden = updates;
      $('err').hidden = true;
    });
  });

  document.querySelectorAll('#bar-updates [data-f]').forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.dataset.f;
      document.querySelectorAll('#bar-updates [data-f]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      render();
    });
  });
  document.querySelectorAll('#bar-suggestions [data-sf]').forEach(function (b) {
    b.addEventListener('click', function () {
      sfilter = b.dataset.sf;
      document.querySelectorAll('#bar-suggestions [data-sf]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      renderSug();
    });
  });
  $('refresh').addEventListener('click', function () { load().catch(function (e) { showErr(e.message); }); });
  $('srefresh').addEventListener('click', function () { loadSug().catch(function (e) { showErr(e.message); }); });

  /* Approved submissions leave here as a file and are applied by
     scripts/apply-submissions.py, so every change to businesses.json still
     arrives through git with a diff to read. Nothing edits the live dataset
     from a web page. Marking them applied afterwards is what stops the same
     change being exported twice. */
  $('export').addEventListener('click', function () {
    var approved = ROWS.filter(function (r) { return r.status === 'approved'; });
    if (!approved.length) { showErr('Nothing is approved and waiting to be applied.'); return; }
    download('approved-submissions.json', approved);
    if (!confirm('Downloaded ' + approved.length + '. Mark them applied?\n\nDo this once you have actually run apply-submissions.py — it is what stops them being exported again.')) return;
    Promise.all(approved.map(function (r) {
      return api({ action: 'set-status', submission_id: r.submission_id, status: 'applied', review_note: r.review_note });
    })).then(load).catch(function (e) { showErr(e.message); });
  });

  /* Same rule on this side: approving is not publishing. The file goes to
     scripts/apply-suggestions.py, which scaffolds the record; 'added' means
     it is really in businesses.json. */
  $('sexport').addEventListener('click', function () {
    var approved = SUGS.filter(function (s) { return s.status === 'approved'; });
    if (!approved.length) { showErr('Nothing is approved and waiting to be added.'); return; }
    download('approved-suggestions.json', approved);
    if (!confirm('Downloaded ' + approved.length + '. Mark them added?\n\nDo this once you have actually run apply-suggestions.py and committed the records — it is what stops them being exported again.')) return;
    Promise.all(approved.map(function (s) {
      return api({ action: 'set-suggestion-status', suggestion_id: s.suggestion_id,
                   status: 'added', dismiss_reason: '', review_note: s.review_note });
    })).then(loadSug).catch(function (e) { showErr(e.message); });
  });

  function download(name, rows) {
    var blob = new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
  }

  var saved = sessionStorage.getItem('gm-admin-pw');
  if (saved) {
    PW = saved;
    loadAll().then(function () { $('gate').hidden = true; $('app').hidden = false; })
          .catch(function () { sessionStorage.removeItem('gm-admin-pw'); });
  }
})();
</script>
</body>
</html>
